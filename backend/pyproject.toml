[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysdesign-backend"
version = "1.0.0"
description = "Real-Time Collaborative System Design Simulator — Backend"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
# Allow tests to find app/ without needing an installed package
pythonpath = ["."]

[tool.coverage.run]
source = ["app", "simulation"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
